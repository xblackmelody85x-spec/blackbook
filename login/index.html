<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>로그인 · 블랙북</title>
<meta name="description" content="블랙북에 로그인하고 내 책을 이어서 쓰세요." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0f0c09" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315110d'/%3E%3Cpath d='M32 20c-5-4-13-5-21-3v30c8-2 16-1 21 3 5-4 13-5 21-3V17c-8-2-16-1-21 3z' fill='none' stroke='%23e6c56a' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M32 20v30' stroke='%23e6c56a' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
<style>
  /* Layout: one centered card on the same dark desk as the app, gold foil accents. UI only: nothing here signs anyone in yet. */
  :root {
    color-scheme: dark;
    --ink: #15110d; --card: #1d1812;
    --gold: #e6c56a; --gold-hi: #fff6d0; --gold-lo: #c9a24d; --gold-title: #f3d78a; --gold-rgb: 230, 197, 106;
    --on-dark: #f3eadf; --muted: rgba(243, 234, 223, 0.72);
    --line: rgba(230, 197, 106, 0.28);
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple Myungjo", serif;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; color: var(--on-dark); font-family: var(--sans); font-size: 16px; line-height: 1.7;
    background: radial-gradient(ellipse 50% 54% at 50% 42%, rgba(214, 205, 140, 0.2), rgba(190, 180, 110, 0.06) 50%, transparent 76%), radial-gradient(ellipse 130% 95% at 50% 42%, transparent 52%, rgba(10, 12, 4, 0.55) 100%), linear-gradient(180deg, #5b5a3a 0%, #4a4a2e 52%, #373721 100%);
    background-color: #373721; background-attachment: fixed;
  }
  a { color: inherit; }
  p { margin: 0; text-wrap: pretty; }
  .top { padding: max(18px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-left, 0px)) 0; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--gold-title); }
  main { display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 32px; }
  .card { width: min(420px, 100%); background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 90px), var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 34px 28px 26px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 5px transparent, inset 0 0 0 6px rgba(var(--gold-rgb), 0.12); }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .crest { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); display: grid; place-items: center; box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px rgba(var(--gold-rgb), 0.7); }
  .crest i { width: 10px; height: 10px; display: block; background: linear-gradient(135deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); transform: rotate(45deg); }
  h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 30px; letter-spacing: 0.14em; color: var(--gold-title); text-shadow: 0 1px 0 rgba(255, 246, 210, 0.5); }
  .sub { font-size: 15px; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 18px; border-radius: 12px; font: 600 16px/1 var(--sans); cursor: pointer; border: 1px solid transparent; }
  .btn:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
  .btn-google { background: #f6f2ea; color: #1f1b16; }
  .btn-google:hover { background: #fff; }
  .btn-google svg { width: 20px; height: 20px; flex: 0 0 20px; }
  .btn-gold { background: var(--gold); color: #1a140c; }
  .btn-gold:hover { background: var(--gold-title); }
  .or { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 14px; font-weight: 500; }
  input { width: 100%; min-height: 50px; padding: 0 16px; border-radius: 12px; font: 16px var(--sans); color: var(--on-dark); background: rgba(0, 0, 0, 0.28); border: 1px solid var(--line); }
  input::placeholder { color: rgba(243, 234, 223, 0.42); }
  input:focus { border-color: var(--gold); outline-offset: 0; }
  .hint { font-size: 13px; color: var(--muted); }
  .msg { min-height: 22px; font-size: 14px; color: var(--gold-title); text-align: center; }
  .legal { font-size: 12.5px; line-height: 1.7; color: var(--muted); text-align: center; border-top: 1px solid rgba(var(--gold-rgb), 0.14); padding-top: 16px; }
  .legal a { text-underline-offset: 3px; }
  .legal a:hover { color: var(--gold-title); }
  footer { padding: 0 20px max(22px, env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) { .card { padding: 28px 20px 22px; border-radius: 16px; } h1 { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="top"><a class="back" href="../">← 홈페이지로</a></div>

<main>
  <section class="card" aria-labelledby="login-title">
    <div class="brand">
      <span class="crest" aria-hidden="true"><i></i></span>
      <h1 id="login-title">블랙북</h1>
      <p class="sub">로그인하고 내 책을 이어서 쓰세요</p>
    </div>

    <button type="button" class="btn btn-google" id="googleBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Google로 계속하기
    </button>

    <div class="or" role="separator">또는</div>

    <form id="emailForm" novalidate>
      <label for="email">이메일 주소</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" />
      <button type="submit" class="btn btn-gold">로그인 링크 받기</button>
      <p class="hint">비밀번호는 필요 없어요. 메일로 받은 링크를 누르면 로그인돼요.</p>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <p class="legal">계속하면 <a href="../legal/terms.html">이용약관</a>과 <a href="../legal/privacy.html">개인정보처리방침</a>에 동의한 것으로 봅니다.</p>
  </section>
</main>

<footer>처음이세요? 가입 없이 <a href="../app/">바로 써 볼 수 있어요</a>.</footer>

<script>
// 화면만 만든 상태예요. 실제 로그인은 아직 연결하지 않았고, 누르면 안내만 보여요.
(function () {
  var msg = document.getElementById("msg");
  function soon() { msg.textContent = "로그인은 준비 중이에요. 조금만 기다려 주세요."; }
  document.getElementById("googleBtn").addEventListener("click", soon);
  document.getElementById("emailForm").addEventListener("submit", function (e) { e.preventDefault(); soon(); });
})();
</script>
</body>
</html>
